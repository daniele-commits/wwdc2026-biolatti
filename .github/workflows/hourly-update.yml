name: WWDC 2026 hourly update

# Gira ogni ora (UTC). Lo script update_news.py si auto-limita alla finestra
# evento (8-12 giugno 2026 + 12h di grazia): fuori finestra esce subito.
# Dopo il 13 giugno il workflow puo essere disabilitato da Actions > ... > Disable.
on:
  schedule:
    # Solo ore attive (UTC; CEST = UTC+2): keynote + giornata/serata USA.
    # Salta le ore morte europee (mattina/pomeriggio) per non bruciare credito.
    - cron: "0 16-23 * * *"   # 18:00 - 01:00 CEST
    - cron: "0 0-1 * * *"     # 02:00 - 03:00 CEST (coda notturna keynote)
  workflow_dispatch: {}   # esecuzione manuale dal tab Actions (per effetto "live")

# Evita run sovrapposti.
concurrency:
  group: wwdc-hourly
  cancel-in-progress: false

permissions:
  contents: write   # necessario per fare push del news.json e dell'HTML rigenerato

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esegui aggiornamento
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WWDC_MODEL: ${{ vars.WWDC_MODEL }}
        run: |
          set -o pipefail
          python update_news.py | tee run.log
          SUMMARY_LINE="$(grep -E '^SUMMARY::' run.log | tail -1 || true)"
          COUNT="$(echo "$SUMMARY_LINE" | awk -F'::' '{print $2}')"
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"

      - name: Commit & push
        id: commit
        env:
          COUNT: ${{ steps.run.outputs.count }}
        run: |
          git config user.name  "Kairos Bot"
          git config user.email "kairos@biolatti.it"
          # non versionare i file di lavoro del run
          rm -f run.log
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nessuna modifica da committare."
          else
            git commit -m "WWDC update: ${COUNT} nuovi annunci"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Posta sul canale Telegram
        if: steps.run.outputs.count != '0' && steps.commit.outputs.changed == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Un messaggio per articolo: titolo + estratto + link pubblico.
          # L'anteprima del link e attiva, cosi il canale mostra la card della pagina.
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error

          token = os.environ.get("TG_TOKEN", "")
          chat = os.environ.get("TG_CHAT", "")
          if not token or not chat:
              print("Secret Telegram mancanti: skip notifica.")
              raise SystemExit(0)

          try:
              items = json.load(open("notify_items.json", encoding="utf-8"))
          except FileNotFoundError:
              items = []

          for it in items:
              text = f"{it['title']}\n\n{it['excerpt']}\n\n{it['url']}"
              data = urllib.parse.urlencode({
                  "chat_id": chat,
                  "text": text,
                  "disable_web_page_preview": "false",
              }).encode()
              url = f"https://api.telegram.org/bot{token}/sendMessage"
              try:
                  with urllib.request.urlopen(url, data=data, timeout=30) as r:
                      r.read()
                  print("Postato:", it["title"])
              except urllib.error.HTTPError as e:
                  print("Errore Telegram:", e.code, e.read().decode("utf-8", "replace")[:200])
              time.sleep(3)  # distanzia i messaggi: meno effetto "raffica" nel canale
          PY
