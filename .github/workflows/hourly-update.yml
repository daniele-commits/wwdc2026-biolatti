name: WWDC 2026 hourly update

# Evento concluso (8-12 giugno 2026): il blocco `schedule:` e stato rimosso
# (GitHub lo aveva gia auto-disabilitato). Resta solo l'avvio manuale.
# Il primo step controlla la finestra evento e, se e chiusa, il job termina
# senza fare nulla (nessuna chiamata API, nessun commit).
# Per un evento futuro: aggiornare EVENT_END qui sotto e in data/news.json
# ("eventEnd") e, se serve, ripristinare uno `schedule:`.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Ignora la finestra evento (WWDC_FORCE=1)"
        type: boolean
        default: false

env:
  EVENT_END: "2026-06-12T23:59:00+02:00"   # fine evento (stessa data di data/news.json)
  GRACE_HOURS: "12"                        # grazia per i follow-up post-evento

# Evita run sovrapposti.
concurrency:
  group: wwdc-hourly
  cancel-in-progress: false

permissions:
  contents: write   # necessario per fare push del news.json e dell'HTML rigenerato

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Controllo finestra evento
        id: window
        env:
          FORCE: ${{ inputs.force }}
        run: |
          end_ts=$(date -d "$EVENT_END" +%s)
          limit=$(( end_ts + GRACE_HOURS * 3600 ))
          now=$(date +%s)
          if [ "$FORCE" = "true" ] || [ "$now" -le "$limit" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Finestra evento aperta (o forzata): procedo."
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Finestra evento chiusa ($EVENT_END + ${GRACE_HOURS}h): nessuna azione."
          fi

      - name: Checkout
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v5

      - name: Setup Python
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test offline
        if: steps.window.outputs.active == 'true'
        run: python -m unittest discover -s tests

      - name: Esegui aggiornamento
        id: run
        if: steps.window.outputs.active == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WWDC_MODEL: ${{ vars.WWDC_MODEL }}
          WWDC_FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          set -o pipefail
          python update_news.py | tee run.log
          SUMMARY_LINE="$(grep -E '^SUMMARY::' run.log | tail -1 || true)"
          COUNT="$(echo "$SUMMARY_LINE" | awk -F'::' '{print $2}')"
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"

      - name: Commit & push
        id: commit
        if: steps.window.outputs.active == 'true'
        env:
          COUNT: ${{ steps.run.outputs.count }}
        run: |
          git config user.name  "Kairos Bot"
          git config user.email "kairos@biolatti.it"
          # non versionare i file di lavoro del run
          rm -f run.log
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nessuna modifica da committare."
          else
            git commit -m "WWDC update: ${COUNT} nuovi annunci"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Posta sul canale Telegram
        if: steps.window.outputs.active == 'true' && steps.run.outputs.count != '0' && steps.commit.outputs.changed == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Un messaggio per articolo: titolo + estratto + link pubblico.
          # L'anteprima del link e attiva, cosi il canale mostra la card della pagina.
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error

          token = os.environ.get("TG_TOKEN", "")
          chat = os.environ.get("TG_CHAT", "")
          if not token or not chat:
              print("Secret Telegram mancanti: skip notifica.")
              raise SystemExit(0)

          try:
              items = json.load(open("notify_items.json", encoding="utf-8"))
          except FileNotFoundError:
              items = []

          for it in items:
              text = f"{it['title']}\n\n{it['excerpt']}\n\n{it['url']}"
              data = urllib.parse.urlencode({
                  "chat_id": chat,
                  "text": text,
                  "disable_web_page_preview": "false",
              }).encode()
              url = f"https://api.telegram.org/bot{token}/sendMessage"
              try:
                  with urllib.request.urlopen(url, data=data, timeout=30) as r:
                      r.read()
                  print("Postato:", it["title"])
              except urllib.error.HTTPError as e:
                  print("Errore Telegram:", e.code, e.read().decode("utf-8", "replace")[:200])
              time.sleep(3)  # distanzia i messaggi: meno effetto "raffica" nel canale
          PY
